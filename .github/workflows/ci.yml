name: ci
# PR + main + manual only: the repo is private and Actions minutes cost money.
on:
  pull_request:
  push: { branches: [main] }
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debuginfo: linking dozens of integration-test binaries with it killed `ld` (SIGBUS, runner
  # disk) on ubuntu-latest; nothing in CI reads debuginfo.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Cost control: macos-15 bills 10x and windows 2x, so those jobs only run when their inputs change
  # (always on workflow_dispatch and on every push to main). The rust job always runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.f.outputs.macos }}
      windows: ${{ steps.f.outputs.windows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          common='^(core/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          files="$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo ALL)"
          { [ "$EVENT" = workflow_dispatch ] || [ "$EVENT" = push ]; } && files=ALL
          hit() {
            if [ "$files" = ALL ] || printf '%s\n' "$files" | grep -Eq "$1"; then echo true; else echo false; fi
          }
          echo "macos=$(hit "$common|^(apps/macos/|scripts/(gen-bindings|build-xcframework)\.sh$)")" >> "$GITHUB_OUTPUT"
          echo "windows=$(hit "$common|^(apps/windows/|scripts/(gen-bindings-cs|build-windows-dll)\.ps1$)")" >> "$GITHUB_OUTPUT"

  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with: { toolchain: "1.99.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # ~30 GB of preinstalled SDKs we never use; the debug test artifacts of the workspace are big.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Backend and core tests start their own throwaway Postgres through testcontainers
      # (tests/common/pg.rs), so no `services:` block: the runner's Docker is all they need.
      - run: docker pull postgres:17 && docker pull axllent/mailpit:v1.31.5
      - run: cargo test --workspace

  macos:
    name: macos (swift test)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with: { toolchain: "1.99.0" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Universal xcframework + generated Swift; both SwiftPM packages link it.
      - run: scripts/build-xcframework.sh
      - run: swift test --package-path apps/macos/Packages/FsyncCoreKit
      # The 3 integration tests skip unless FSYNC_IT_* is set; see macOS integration note in
      # plans/261013-2029-fsync-native-mvp/phase-10-infra-relay-backend-deploy.md.
      - run: swift test --package-path apps/macos/FsyncMac

  windows:
    name: windows (dotnet test)
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with: { toolchain: "1.99.0" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: "8.0.x" }
      # Vendored OpenSSL (SQLCipher) needs Strawberry Perl (preinstalled, but Git's perl wins on
      # PATH) and NASM.
      - name: Toolchain for vendored OpenSSL
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Cache uniffi-bindgen-cs
        id: bindgen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/uniffi-bindgen-cs.exe
          key: uniffi-bindgen-cs-v0.10.0+v0.29.4-${{ runner.os }}
      - name: Install uniffi-bindgen-cs
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.10.0+v0.29.4 --locked
      # x64 only: the ARM64 DLL is built in release pipelines, not needed to run the tests.
      - name: Build core DLL and C# bindings
        shell: pwsh
        run: scripts/build-windows-dll.ps1 -Rids win-x64
      - run: dotnet test apps/windows/Fsync.sln -c Release
