[package]
name = "fsync-core"
description = "fsync engine: transport, trust, pairing, clip/file protocols, history"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fsync-proto.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
postcard.workspace = true
tracing.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
zeroize.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
uuid.workspace = true
getrandom = "0.4"
futures-util = "0.3"
# Pinned: the LAN-first path selector uses iroh's unstable PathSelector API.
iroh = { version = "=1.3.0", features = ["unstable-custom-transports"] }
netdev = { version = "0.46", default-features = false, features = ["gateway"] }
n0-watcher = "1"
iroh-mdns-address-lookup = "0.6"
spake2 = "0.4"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
chacha20poly1305 = { version = "0.10", features = ["stream"] }
fs4 = "1.1"

[features]
# Fault-injection hooks for integration tests; never enabled in product builds.
test-hooks = []

[dev-dependencies]
fsync-core = { path = ".", features = ["test-hooks"] }
fsync-backend = { path = "../../backend" }
tempfile = "3"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
axum = "0.8"
testcontainers = "0.25"
libc = "0.2"
# In-process relay servers for the multi-relay tests (a real relay, plain http, loopback).
iroh-relay = { version = "1.3", features = ["server"] }
