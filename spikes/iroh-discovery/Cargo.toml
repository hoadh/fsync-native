[package]
name = "iroh-discovery-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of the root workspace.
[workspace]

[dependencies]
iroh = "1.3"
iroh-blobs = "0.103"
iroh-relay = { version = "1.3", features = ["server"] }
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["full"] }
n0-error = "1"
n0-future = "0.3"
rand = "0.9"
blake3 = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
