# Local testing overlay: adds a Caddy (local CA) running deploy/Caddyfile in front of the stack
# and publishes the plain-HTTP backend/relay on loopback so fsync-cli (which only trusts public
# CAs) can use `--insecure-http`. Never use on a server.
#   docker compose -p fsync-local --env-file .env.local -f compose.yml -f compose.local.yml up -d --build
services:
  caddy:
    image: caddy:2
    restart: "no"
    environment:
      API_HOST: api.localhost
      RELAY_HOST: relay.localhost
      CADDY_GLOBAL_OPTIONS: "local_certs"
      # Same compose network as the stack (FSYNC_SUBNET, already in TRUSTED_PROXIES). The host ports
      # bind 127.0.0.1 only, so host.docker.internal would be refused.
      BACKEND_UPSTREAM: backend:8080
      RELAY_UPSTREAM: relay:3340
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "127.0.0.1:${LOCAL_HTTPS_PORT}:443"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
      interval: 5s
      retries: 10
  relay:
    volumes:
      - caddy_data:/relay-cert:ro
    depends_on: [caddy]
volumes:
  caddy_data:
