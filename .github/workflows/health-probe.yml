name: health-probe
# Hourly external probe of the public backend and relays. A failing run emails the repo owner
# (GitHub's default notification for failed scheduled workflows). Hourly on purpose: the repo is
# private, a run bills a full minute (~720 of the 2000 free minutes a month).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { sparse-checkout: deploy/scripts/probe-health.sh, sparse-checkout-cone-mode: false }
      - run: deploy/scripts/probe-health.sh
