[package]
name = "fsync-linux-platform"
description = "Linux OS integration for the fsync desktop app (clipboard, secrets, IPC, files). No Qt."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only control commands over IPC and FSYNC_SECRETS=file in release builds. Never packaged.
e2e-control = []

[dependencies]
fsync-core.workspace = true
fsync-proto.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
x11rb.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
blake3.workspace = true
rustix = { workspace = true, features = ["event", "pipe"] }
oo7.workspace = true
notify-rust.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
