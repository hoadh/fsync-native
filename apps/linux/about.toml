# cargo-about config: license report of every crate linked into fsync-linux (workspace crates
# are private and skipped). Output template: packaging/about.hbs.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
  "Unlicense",
  "LGPL-2.1-or-later",
  "CDLA-Permissive-2.0",
]
private = { ignore = true }
targets = ["x86_64-unknown-linux-gnu"]
