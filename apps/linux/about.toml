# cargo-about config: license report of every crate linked into fsync-linux (workspace crates
# are private and skipped). Output template: packaging/about.hbs.
# `accepted` is exactly what the release graph needs (2026-11-11), so a crate with any other
# license (LGPL, GPL, BSL, ...) fails `cargo about generate --fail` and the build. Add an entry
# only after checking the new license is compatible with shipping fsync as MIT OR Apache-2.0.
accepted = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",             # attohttpc (file-level copyleft; source note in about.hbs)
  "Unlicense",           # ksni
  "CDLA-Permissive-2.0", # webpki-roots (the Mozilla root list)
]
private = { ignore = true }
targets = ["x86_64-unknown-linux-gnu"]

# libsqlite3-sys declares MIT, but its `bundled-sqlcipher` build statically compiles
# sqlcipher/sqlite3.c, which is BSD-3-Clause (Zetetic LLC). BSD-3 asks for the notice in binary
# distributions, so the report must carry it. The checksums pin the reviewed files: a new
# libsqlite3-sys version with changed texts fails the build until they are re-checked.
[libsqlite3-sys.clarify]
license = "MIT AND BSD-3-Clause"

[[libsqlite3-sys.clarify.files]]
path = "LICENSE"
license = "MIT"
checksum = "f59ba65550f2a5adff98ec6478d783402c8e0a3eb515025c0b3438f3d30dc39e"

[[libsqlite3-sys.clarify.files]]
path = "sqlcipher/LICENSE"
license = "BSD-3-Clause"
checksum = "ea4fcb309f14a22065e1ea45362d494d320012249ed865fe9c7c0946db754131"
